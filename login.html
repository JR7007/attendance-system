<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Client Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Client Example</h1>
        <p class="text-gray-500 mt-2">Attendance Management System</p>
        <p class="text-gray-400 text-sm">Sistem Pengurusan Kehadiran</p>
      </div>

      <div
        id="errorBox"
        class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm"
      ></div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email</label
          >
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 pr-12"
            />
            <button
              type="button"
              id="eyeBtn"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
            >
              <svg
                id="eyeIcon"
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            </button>
          </div>
        </div>

        <button
          id="loginBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 text-sm"
        >
          Log In / Masuk
        </button>
      </div>

      <p class="text-center text-gray-400 text-xs mt-6">
        © 2025 Client Example. All rights reserved.
      </p>
    </div>

    <script type="module">
      import { supabase } from "./js/supabase.js";

      window._supabase = supabase;

      // Eye icon toggle
      document.getElementById("eyeBtn").addEventListener("click", function () {
        const input = document.getElementById("password");
        const icon = document.getElementById("eyeIcon");
        if (input.type === "password") {
          input.type = "text";
          icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21" />
          `;
        } else {
          input.type = "password";
          icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          `;
        }
      });

      // Login button
      document
        .getElementById("loginBtn")
        .addEventListener("click", handleLogin);

      // Enter key
      document.addEventListener("keypress", function (e) {
        if (e.key === "Enter") handleLogin();
      });

      // Check if already logged in
      const {
        data: { session },
      } = await supabase.auth.getSession();
      if (session) {
        const { data: profile } = await supabase
          .from("users")
          .select("role")
          .eq("id", session.user.id)
          .single();
        if (profile?.role === "admin") {
          window.location.href = "./admin.html";
        } else {
          window.location.href = "./employee.html";
        }
      }

      async function handleLogin() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorBox = document.getElementById("errorBox");
        const loginBtn = document.getElementById("loginBtn");

        errorBox.classList.add("hidden");

        if (!email || !password) {
          errorBox.textContent = "Please enter your email and password.";
          errorBox.classList.remove("hidden");
          return;
        }

        loginBtn.textContent = "Logging in...";
        loginBtn.disabled = true;

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password,
          });

          if (error) {
            errorBox.textContent =
              "Invalid email or password. Please try again.";
            errorBox.classList.remove("hidden");
            loginBtn.textContent = "Log In / Masuk";
            loginBtn.disabled = false;
            return;
          }

          const { data: profile } = await supabase
            .from("users")
            .select("role")
            .eq("id", data.user.id)
            .single();

          if (profile?.role === "admin") {
            window.location.href = "./admin.html";
          } else {
            window.location.href = "./employee.html";
          }
        } catch (err) {
          errorBox.textContent = "Something went wrong. Please try again.";
          errorBox.classList.remove("hidden");
          loginBtn.textContent = "Log In / Masuk";
          loginBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
